StylesPath = .vale/styles
MinAlertLevel = warning

[*.{md,mdx}]
BasedOnStyles = Kosmos, Google, write-good, Vale
Vale.Terms = NO
Vale.Avoid = NO
Vale.Spelling = NO
Google.Will = NO
Google.Passive = warning
write-good.TooWordy = NO

[GLOSSARY.md]
Kosmos.Glossary = NO

[content/docs/**/*.{md,mdx}]
Kosmos.SentenceLength = error

[node_modules/.cache/vale/descriptions.md]
Kosmos.SentenceLength = error
